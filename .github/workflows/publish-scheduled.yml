name: Publish scheduled posts
on:
  schedule:
    - cron: '0 * * * *'   # Every hour
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          API_KEY: ${{ secrets.TAC_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::TAC_API_KEY secret is not set or empty"
            exit 1
          fi
      - name: Wake up backend
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 30 https://api.theaugmentedcraftsman.christianborrello.dev/health; then
              echo "Backend is up"
              exit 0
            fi
            echo "Attempt $i — backend not ready, waiting 10s..."
            sleep 10
          done
          echo "Backend did not wake up after 60s"
          exit 1
      - name: Publish due posts
        env:
          API_KEY: ${{ secrets.TAC_API_KEY }}
        run: |
          RESPONSE=$(curl -sf --max-time 30 -X POST \
            -H "X-Admin-Key: $API_KEY" \
            "https://api.theaugmentedcraftsman.christianborrello.dev/api/posts/publish-scheduled")
          echo "$RESPONSE"
      - name: Notify on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled publish failed (${new Date().toISOString().split('T')[0]})`,
              body: `Workflow run: ${process.env.RUN_URL}`,
              labels: ['publish-failure']
            });
