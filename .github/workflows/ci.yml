name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BACKEND=$(git diff --name-only HEAD~1 HEAD -- backend/ .github/workflows/ci.yml | wc -l | tr -d ' ')
          FRONTEND=$(git diff --name-only HEAD~1 HEAD -- frontend/ .github/workflows/ci.yml | wc -l | tr -d ' ')
          echo "backend=$( [ "$BACKEND" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "frontend=$( [ "$FRONTEND" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

  backend-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
        working-directory: backend

      - name: Build
        run: dotnet build -c Release --no-restore
        working-directory: backend

      - name: Unit tests (Domain)
        run: dotnet test tests/TacBlog.Domain.Tests/ -c Release --no-build --logger "trx;LogFileName=domain.trx"
        working-directory: backend

      - name: Unit tests (Application)
        run: dotnet test tests/TacBlog.Application.Tests/ -c Release --no-build --logger "trx;LogFileName=application.trx"
        working-directory: backend

      - name: Unit tests (Infrastructure)
        run: dotnet test tests/TacBlog.Infrastructure.Tests/ -c Release --no-build --filter "Category!=RequiresCredentials" --logger "trx;LogFileName=infrastructure.trx"
        working-directory: backend

      - name: Integration tests
        run: dotnet test tests/TacBlog.Api.Tests/ -c Release --no-build --logger "trx;LogFileName=integration.trx"
        working-directory: backend

      - name: Acceptance tests
        run: dotnet test tests/TacBlog.Acceptance.Tests/ -c Release --no-build --filter "Category!=manual" --logger "trx;LogFileName=acceptance.trx"
        working-directory: backend

      - name: Build Docker image
        run: docker build -t tacblog-api:${{ github.sha }} .
        working-directory: backend

      - name: Push to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          REGISTRY: ghcr.io
          IMAGE: ghcr.io/${{ github.repository_owner }}/tacblog-api
        run: |
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u ${{ github.actor }} --password-stdin
          docker tag tacblog-api:${{ github.sha }} "${IMAGE_LC}:${{ github.sha }}"
          docker tag tacblog-api:${{ github.sha }} "${IMAGE_LC}:latest"
          docker push "${IMAGE_LC}:${{ github.sha }}"
          docker push "${IMAGE_LC}:latest"

  backend-deploy:
    needs: backend-ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "/home/runner/.koyeb/bin" >> $GITHUB_PATH

      - name: Force Koyeb to pull latest image
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE_LC=$(echo "ghcr.io/${REPO_OWNER}/tacblog-api:latest" | tr '[:upper:]' '[:lower:]')
          koyeb services update ${{ vars.KOYEB_SERVICE }} \
            --app ${{ vars.KOYEB_APP }} \
            --docker "${IMAGE_LC}"

      - name: Wait for deployment to become healthy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          echo "Waiting for Koyeb deployment to become healthy..."
          for i in $(seq 1 24); do
            STATUS=$(koyeb services describe ${{ vars.KOYEB_SERVICE }} \
              --app ${{ vars.KOYEB_APP }} \
              --output json 2>/dev/null | jq -r '.status // empty' 2>/dev/null | head -1 || echo "unknown")
            echo "Attempt $i/24: status=$STATUS"
            if [ "$STATUS" = "HEALTHY" ]; then
              echo "Deployment is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not become healthy within 4 minutes"
          exit 1

  smoke-test:
    needs: backend-deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Smoke test (liveness)
        env:
          SMOKE_URL: ${{ vars.API_URL }}
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${SMOKE_URL}/health" 2>/dev/null || echo "000")
            echo "Attempt $i/6: /health returned $STATUS"
            [ "$STATUS" = "200" ] && echo "Liveness check passed" && exit 0
            sleep 10
          done
          echo "Smoke test failed: /health did not return 200 after 6 attempts"
          exit 1

      - name: Smoke test (readiness)
        env:
          SMOKE_URL: ${{ vars.API_URL }}
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${SMOKE_URL}/health/ready" 2>/dev/null || echo "000")
            echo "Attempt $i/6: /health/ready returned $STATUS"
            [ "$STATUS" = "200" ] && echo "Readiness check passed" && exit 0
            sleep 10
          done
          echo "Smoke test failed: /health/ready did not return 200 after 6 attempts (database may be unreachable)"
          exit 1

  frontend-ci:
    needs: [detect-changes, smoke-test]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.detect-changes.outputs.frontend == 'true' || needs.smoke-test.result == 'success') &&
      needs.smoke-test.result != 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund
        working-directory: frontend

      - name: Type check
        run: npx astro check
        working-directory: frontend

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Wait for API to be available
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          echo "Waiting for API at ${API_URL}/health ..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${API_URL}/health" 2>/dev/null || echo "000")
            echo "Attempt $i/18: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "API is available"
              exit 0
            fi
            sleep 10
          done
          echo "API did not become available within 3 minutes"
          exit 1

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
